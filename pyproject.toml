[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inverter-climate"
version = "0.4.0"
description = "Energy-aware climate coordination through Home Assistant and Victron"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["httpx>=0.28.1,<1"]

[project.scripts]
inverter-climate = "inverter_climate.service:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "PyYAML==6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
