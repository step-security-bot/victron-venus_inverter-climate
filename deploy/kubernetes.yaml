apiVersion: v1
kind: Namespace
metadata:
  name: inverter-climate
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inverter-climate-config
  namespace: inverter-climate
data:
  config.toml: |
    [service]
    entity_id = "climate.replace_me"
    mode = "observe"
    poll_seconds = 30
    state_path = "/data/state.json"
    status_path = "/data/status.json"

    [policy]
    comfort_min_c = 17
    comfort_max_c = 19
    boost_delta_c = 0.5
    heating_power_w = 500
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inverter-climate-state
  namespace: inverter-climate
spec:
  accessModes:
    - ReadWriteOnce
  # Select a storage class that supports POSIX locks and durable atomic renames.
  storageClassName: local-path
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inverter-climate
  namespace: inverter-climate
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inverter-climate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inverter-climate
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inverter-climate
          # Replace COMMIT with a tested commit tag or pin the published digest.
          image: ghcr.io/victron-venus/inverter-climate:COMMIT
          imagePullPolicy: IfNotPresent
          command:
            - inverter-climate
          args:
            - --config
            - /etc/inverter-climate/config.toml
          envFrom:
            - secretRef:
                name: inverter-climate-env
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/inverter-climate
              readOnly: true
            - name: state
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import pathlib, time
                  p = pathlib.Path('/data/status.json')
                  assert p.is_file() and 0 <= time.time() - p.stat().st_mtime <= 180
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import json, pathlib, time
                  p = pathlib.Path('/data/status.json')
                  assert 0 <= time.time() - p.stat().st_mtime <= 120
                  status = json.loads(p.read_text())
                  assert status['mode'] == 'observe' and status['errors'] == []
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import pathlib, time
                  p = pathlib.Path('/data/status.json')
                  assert 0 <= time.time() - p.stat().st_mtime <= 240
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: inverter-climate-config
            defaultMode: 0444
        - name: state
          persistentVolumeClaim:
            claimName: inverter-climate-state
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inverter-climate-no-ingress
  namespace: inverter-climate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inverter-climate
  policyTypes:
    - Ingress
  ingress: []
