[service]
entity_id = "climate.example_thermostat"
mode = "observe"
poll_seconds = 30
state_path = "state.json"
status_path = "status.json"

[policy]
comfort_min_c = 17
comfort_max_c = 19
boost_delta_c = 0.5
heating_power_w = 500
start_margin_w = 100
start_soc = 90
stop_soc = 80
surplus_hold_seconds = 180
minimum_boost_seconds = 900
maximum_boost_seconds = 1800
command_interval_seconds = 900
manual_hold_seconds = 7200
confirmation_seconds = 120
max_energy_age_seconds = 120
max_import_w = 100
max_battery_discharge_w = 50
