name: Publish SetupHelper package
on:
  workflow_run:
    workflows: [Release pipeline]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to verify (empty selects the latest stable release)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: setuphelper-latest
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      vars.SETUPHELPER_PUBLICATION_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Publish exact verified stable bytes to the package branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/publish_setuphelper.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --execute
